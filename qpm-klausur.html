function b64(s){var r=atob(s),a=new Uint8Array(r.length);for(var i=0;i<r.length;i++)a[i]=r.charCodeAt(i);return a;}
var m=document.getElementById("m"), b=document.getElementById("b"), p=document.getElementById("p");
function fehler(t){ m.className="msg err"; m.textContent=t; b.disabled=false; b.textContent="Öffnen"; }
async function oeffne(){
  var pw=p.value; if(!pw) return fehler("Bitte Passwort eingeben.");
  if(!(window.crypto&&window.crypto.subtle))
    return fehler("Dieser Browser unterstützt keine Web-Crypto (HTTPS nötig).");
  b.disabled=true; b.textContent="Entschlüssele …";
  m.className="msg"; m.textContent="Das dauert 1–3 Sekunden.";
  try{
    var enc=new TextEncoder();
    var base=await crypto.subtle.importKey("raw",enc.encode(pw),{name:"PBKDF2"},false,["deriveKey"]);
    var key=await crypto.subtle.deriveKey(
      {name:"PBKDF2",salt:b64(SALT),iterations:ITER,hash:"SHA-256"},
      base,{name:"AES-GCM",length:256},false,["decrypt"]);
    var klar=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(IV)},key,b64(DATA));
    var html=new TextDecoder().decode(klar);
    document.open(); document.write(html); document.close();
  }catch(e){ fehler("Falsches Passwort."); }
}
b.addEventListener("click",oeffne);
p.addEventListener("keydown",function(e){ if(e.key==="Enter") oeffne(); });
